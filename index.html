<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NATAKORN | Academic Portfolio</title>
    <!-- นำเข้าฟอนต์สไตล์เรียบหรู -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- วิดีโอฉากหลังอวกาศ -->
    <video autoplay muted loop id="bg-video">
        <source src="bg-space.mp4" type="video/mp4">
    </video>

    <!-- แถบด้านบน (Header) -->
    <header class="navbar">
        <div class="logo">NATAKORN</div>
        <!-- ปุ่มสลับสถานะ Menu / Close ปุ่มเดียวจบ -->
        <button class="menu-btn" id="menuToggle">≡ Menu</button>
    </header>

    <!-- หน้าเมนูไล่เฉด Gradient Overlay -->
    <div class="menu-overlay" id="menuOverlay">
        <div class="menu-content">
            <div class="menu-brand">NATAKORN</div>
            <nav class="menu-links">
                <a href="#biography">BIOGRAPHY</a>
                <a href="#research">RESEARCH</a>
                <a href="#academic">ACADEMIC</a>
                <a href="#project">PROJECT</a>
                <a href="#competition">COMPETITION</a>
                <a href="#award">AWARD</a>
                <a href="#future">FUTURE</a>
                <a href="#gallery">GALLERY</a>
            </nav>
        </div>
    </div>

    <!-- โค้ดสลับปุ่มแบบ Princeton -->
    <script>
        const menuToggle = document.getElementById('menuToggle');
        const menuOverlay = document.getElementById('menuOverlay');

        // สลับเปิด-ปิดเมนู พร้อมเปลี่ยนข้อความปุ่ม
        menuToggle.addEventListener('click', () => {
            const isOpen = menuOverlay.classList.toggle('active');
            menuToggle.innerText = isOpen ? '✕ Close' : '≡ Menu';
        });

        // เมื่อกดคลิกที่หัวข้อเมนู ให้ปิดเมนูและคืนค่าปุ่มกลับเป็น ≡ Menu
        document.querySelectorAll('.menu-links a').forEach(link => {
            link.addEventListener('click', () => {
                menuOverlay.classList.remove('active');
                menuToggle.innerText = '≡ Menu';
            });
        });
    </script>
</body>
</html>
