<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NATAKORN | Academic Portfolio</title>
    <!-- นำเข้าฟอนต์สไตล์หรูหรา -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:ital,wght@0,600;0,800;1,400;1,600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- วิดีโอฉากหลังอวกาศ -->
    <video autoplay muted loop id="bg-video">
        <source src="bg-space.mp4" type="video/mp4">
    </video>

    <!-- แถบด้านบน (Header) -->
    <header class="navbar">
        <div class="logo">NATAKORN</div>
        <button class="menu-btn" id="menuToggle">≡ Menu</button>
    </header>

    <!-- ข้อความกลางหน้าจอ แยก 2 บรรทัด -->
    <main class="hero-container">
        <div class="hero-content">
            <p class="hero-subtitle">WELCOME TO MY PORTFOLIO</p>
            <h1 class="hero-title">
                "To fly high,<br>
                one must not fear the wind."
            </h1>
        </div>
    </main>

    <!-- หน้าเมนูไล่เฉด Gradient Overlay -->
    <div class="menu-overlay" id="menuOverlay">
        <div class="menu-content">
            <div class="menu-brand">NATAKORN</div>
            <nav class="menu-links">
                <a href="#biography">BIOGRAPHY</a>
                <a href="#research">RESEARCH</a>
                <a href="#academic">ACADEMIC</a>
                <a href="#project">PROJECT</a>
                <a href="#competition">COMPETITION</a>
                <a href="#award">AWARD</a>
                <a href="#future">FUTURE</a>
                <a href="#gallery">GALLERY</a>
            </nav>
        </div>
    </div>

    <!-- โค้ดสลับปุ่มสไตล์ Princeton -->
    <script>
        const menuToggle = document.getElementById('menuToggle');
        const menuOverlay = document.getElementById('menuOverlay');

        menuToggle.addEventListener('click', () => {
            const isOpen = menuOverlay.classList.toggle('active');
            menuToggle.innerText = isOpen ? '✕ Close' : '≡ Menu';
        });

        document.querySelectorAll('.menu-links a').forEach(link => {
            link.addEventListener('click', () => {
                menuOverlay.classList.remove('active');
                menuToggle.innerText = '≡ Menu';
            });
        });
    </script>
</body>
</html>
